services:
  portal:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        APP_VERSION: ${APP_VERSION:-dev}
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER:-cve_portal}:${POSTGRES_PASSWORD:-cve_portal}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-cve_portal}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        APP_VERSION: ${APP_VERSION:-dev}
    command: ["celery", "-A", "worker.app.celery_app.celery_app", "worker", "-Q", "celery", "--loglevel=INFO"]
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER:-cve_portal}:${POSTGRES_PASSWORD:-cve_portal}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-cve_portal}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      portal:
        condition: service_started

  plat-sync-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        APP_VERSION: ${APP_VERSION:-dev}
    command: ["celery", "-A", "worker.app.celery_app.celery_app", "worker", "-Q", "plat_sync", "--concurrency=1", "--loglevel=INFO"]
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER:-cve_portal}:${POSTGRES_PASSWORD:-cve_portal}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-cve_portal}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      portal:
        condition: service_started

  beat:
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        APP_VERSION: ${APP_VERSION:-dev}
    command: ["celery", "-A", "worker.app.celery_app.celery_app", "beat", "--loglevel=INFO"]
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER:-cve_portal}:${POSTGRES_PASSWORD:-cve_portal}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-cve_portal}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
