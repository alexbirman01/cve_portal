apiVersion: apps/v1
kind: Deployment
metadata:
  name: cve-portal-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cve-portal-api
  template:
    metadata:
      labels:
        app: cve-portal-api
    spec:
      containers:
        - name: api
          image: cve-portal-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cve-portal-config
            - secretRef:
                name: cve-portal-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cve-portal-api
spec:
  selector:
    app: cve-portal-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000

