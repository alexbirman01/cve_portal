apiVersion: apps/v1
kind: Deployment
metadata:
  name: cve-portal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cve-portal-ui
  template:
    metadata:
      labels:
        app: cve-portal-ui
    spec:
      containers:
        - name: ui
          image: cve-portal-ui:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cve-portal-ui
spec:
  selector:
    app: cve-portal-ui
  ports:
    - name: http
      port: 80
      targetPort: 80

